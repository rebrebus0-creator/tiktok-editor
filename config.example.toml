# Пример конфига. Скопируй нужные строки в свой файл настроек:
#
#   config.toml                  — общие настройки канала (корень репозитория)
#   projects/<имя>/config.toml   — настройки конкретного ролика (перекрывают общие)
#
# Указывать нужно только то, что меняешь: всё остальное берётся из значений
# по умолчанию (см. src/config.py). Оба файла в .gitignore — это личные настройки.


# ── Формат экспорта ──────────────────────────────────────────────────────────
[video]
width = 1080
height = 1920
fps = 30
crf = 19                # 18-23: меньше — лучше качество и больше файл
preset = "medium"       # ultrafast..veryslow: скорость кодирования
loudnorm = true         # привести громкость к -14 LUFS (норма соцсетей)


# ── Распознавание речи (faster-whisper) ──────────────────────────────────────
[transcribe]
model = "medium"        # "medium" быстрее, "large-v3" точнее
language = "ru"
compute_type = "int8"   # на Mac считается на CPU, int8 — лучший компромисс
beam_size = 5
cache = true            # хранить транскрипт в <проект>/.cache
# Подсказка модели: имена, термины, англицизмы — чтобы писала их правильно
initial_prompt = ""


# ── Авторез пауз ─────────────────────────────────────────────────────────────
[autocut]
enabled = true
silence_db = -32.0      # тише этого уровня — считаем тишиной
min_silence = 0.45      # паузы короче не трогаем
pad_before = 0.12       # отступ перед речью, чтобы не срубить начало слова
pad_after = 0.20
min_segment = 0.30      # куски короче склеиваются с соседом или выбрасываются
merge_gap = 0.40        # максимальный разрыв, через который склеиваем огрызок
protected_pause_max = 2.5   # максимум, который оставляем по тегу [ПАУЗА]
# Пороги для калибровочной таблицы в отчёте команды cut.
calibration_db = [-24.0, -28.0, -32.0, -36.0, -40.0, -45.0]
calibration_min_silence = [0.30, 0.45, 0.60, 0.90]


# ── Караоке-субтитры ─────────────────────────────────────────────────────────
[subtitles]
enabled = true
font_name = "Montserrat ExtraBold"
font_file = "Montserrat-ExtraBold.ttf"   # файл в assets/fonts
font_size = 84
uppercase = true
primary_color = "#FFFFFF"    # ещё не произнесённое слово
highlight_color = "#FFE000"  # слово, которое звучит сейчас
outline_color = "#000000"
outline = 6.0
alignment = 2           # 2 = снизу по центру, 5 = центр экрана
margin_v = 520          # поднять над интерфейсом TikTok/Reels
max_words = 3           # слов в одной плашке


# ── [ЭКРАН] — скринкаст ──────────────────────────────────────────────────────
[screen]
mode = "blur"           # blur | pad | cover
blur_sigma = 30
position_y = 0.42       # 0.0 верх, 0.5 центр, 1.0 низ
audio = "mute"          # mute | mix | replace


# ── [ВСТАВКА] — картинка оверлеем ────────────────────────────────────────────
[insert]
default_duration = 3.0
position = "center"     # center | top | bottom | top-left | top-right | bottom-left | bottom-right
max_width = 0.75        # доля ширины кадра
fade = 0.2


# ── [ЗВУК] и [МУЗЫКА] ────────────────────────────────────────────────────────
[sound]
volume = 0.8

[music]
volume = 0.20
duck = true             # автоматически тише под голос
duck_ratio = 8.0        # сила приглушения
duck_release_ms = 350.0
fade_in = 0.8
fade_out = 1.2


# ── [ЗУМ] ────────────────────────────────────────────────────────────────────
[zoom]
amount = 1.18           # во сколько раз наезжаем
ramp = 0.9              # длительность наезда, сек
duration = 2.5          # сколько держим зум по умолчанию
focus_y = 0.38          # куда наезжаем по вертикали (лицо обычно в верхней трети)


# ── Имена тегов ──────────────────────────────────────────────────────────────
# Можно переименовать под себя или добавить синонимы — парсер читает отсюда.
[tags]
anchor_words = 6        # сколько слов перед тегом брать как якорь
min_similarity = 0.55   # ниже — тег ставится по ближайшему совпадению с warning

[tags.names]
screen = ["ЭКРАН", "SCREEN"]
screen_stop = ["ЭКРАН СТОП", "SCREEN STOP"]
insert = ["ВСТАВКА", "INSERT"]
sound = ["ЗВУК", "SFX", "SOUND"]
music = ["МУЗЫКА", "MUSIC"]
music_stop = ["МУЗЫКА СТОП", "MUSIC STOP"]
pause = ["ПАУЗА", "PAUSE"]
zoom = ["ЗУМ", "ZOOM"]
